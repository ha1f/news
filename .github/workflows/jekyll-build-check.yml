name: Jekyll Build Check

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # latest 追従で全 PR の check が突然 red になるのを防ぐ（CI green はループのマージ条件）。
      # 更新は Renovate の PR で行う（.github/renovate.json5）
      # renovate: datasource=npm depName=playwright
      PLAYWRIGHT_VERSION: 1.61.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
      # baseurl (/news) 込みの URL を再現するため /news 配下に置いて配信する
      - name: Serve site
        run: |
          mkdir -p serve/news
          cp -r _site/. serve/news/
          python3 -m http.server 4000 --directory serve &
          sleep 1
      - name: Install Playwright
        run: npx --yes "playwright@$PLAYWRIGHT_VERSION" install --with-deps chromium
      - name: Screenshot pages
        run: |
          mkdir -p screenshots
          shot() {
            npx --yes "playwright@$PLAYWRIGHT_VERSION" screenshot --browser chromium --full-page \
              --viewport-size "$1" --color-scheme "$2" "$3" "screenshots/$4"
          }
          # 既定フィード（トップ）
          shot 1280,900 light "http://localhost:4000/news/" home-light.png
          shot 1280,900 dark  "http://localhost:4000/news/" home-dark.png
          shot 375,812  light "http://localhost:4000/news/" home-mobile-light.png
          shot 375,812  dark  "http://localhost:4000/news/" home-mobile-dark.png
          # 追加フィード（_data/profiles.json の base に対応するディレクトリ）のトップ
          for dir in _site/feeds/*/; do
            [ -f "$dir/index.html" ] || continue
            id=$(basename "$dir")
            shot 1280,900 light "http://localhost:4000/news/feeds/$id/" "feed-$id-light.png"
            shot 1280,900 dark  "http://localhost:4000/news/feeds/$id/" "feed-$id-dark.png"
          done
          # フィードごとの最新記事（記事のファイル名はフィードの post_slug）
          for slug in $(find _site -regex '.*/20[0-9][0-9]/.*\.html' -printf '%f\n' | sed 's/\.html$//' | sort -u); do
            latest=$(find _site -regex ".*/20[0-9][0-9]/.*/$slug\.html" | sort | tail -1)
            [ -n "$latest" ] || continue
            path="${latest#_site/}"
            shot 1280,900 light "http://localhost:4000/news/$path" "article-$slug-light.png"
            shot 1280,900 dark  "http://localhost:4000/news/$path" "article-$slug-dark.png"
          done
          # 各フィードのアーカイブ
          for archive in _site/archive.html _site/feeds/*/archive.html; do
            [ -f "$archive" ] || continue
            path="${archive#_site/}"
            name=$(echo "${path%.html}" | tr '/' '-')
            shot 1280,900 light "http://localhost:4000/news/$path" "$name-light.png"
            shot 1280,900 dark  "http://localhost:4000/news/$path" "$name-dark.png"
          done
      - name: Upload screenshots
        # 一部失敗でも撮れた分は残す（レビューの材料になる）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: screenshots
          path: screenshots/
