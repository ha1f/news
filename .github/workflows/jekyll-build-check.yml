name: Jekyll Build Check

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # latest 追従で全 PR の check が突然 red になるのを防ぐ（CI green はループのマージ条件）。
      # 更新は Renovate の PR で行う（.github/renovate.json5）
      # renovate: datasource=npm depName=playwright
      PLAYWRIGHT_VERSION: 1.63.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 変更された _posts だけを検査するため base ブランチとの diff を取れるようにする
          fetch-depth: 0
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
      # baseurl (/news) 込みの URL を再現するため /news 配下に置いて配信する
      - name: Serve site
        run: |
          mkdir -p serve/news
          cp -r _site/. serve/news/
          python3 -m http.server 4000 --directory serve &
          sleep 1
      - name: Install Playwright
        run: npx --yes "playwright@$PLAYWRIGHT_VERSION" install --with-deps chromium
      - name: Screenshot pages
        run: |
          mkdir -p screenshots
          shot() {
            npx --yes "playwright@$PLAYWRIGHT_VERSION" screenshot --browser chromium --full-page \
              --viewport-size "$1" --color-scheme "$2" "$3" "screenshots/$4"
          }
          shot 1280,900 light "http://localhost:4000/news/" home-light.png
          shot 1280,900 dark  "http://localhost:4000/news/" home-dark.png
          shot 375,812  light "http://localhost:4000/news/" home-mobile-light.png
          shot 375,812  dark  "http://localhost:4000/news/" home-mobile-dark.png
          latest=$(find _site -regex '.*/20[0-9][0-9]/.*\.html' | sort | tail -1)
          if [ -n "$latest" ]; then
            path="${latest#_site/}"
            shot 1280,900 light "http://localhost:4000/news/$path" article-light.png
            shot 1280,900 dark  "http://localhost:4000/news/$path" article-dark.png
          fi
          if [ -f _site/archive.html ]; then
            shot 1280,900 light "http://localhost:4000/news/archive.html" archive-light.png
            shot 1280,900 dark  "http://localhost:4000/news/archive.html" archive-dark.png
          fi
          if [ -f _site/profiles/index.html ]; then
            shot 1280,900 light "http://localhost:4000/news/profiles/" profiles-light.png
            shot 1280,900 dark  "http://localhost:4000/news/profiles/" profiles-dark.png
          fi
          profile=$(find _site/profiles -name '*.html' ! -name 'index.html' | sort | head -1)
          if [ -n "$profile" ]; then
            path="${profile#_site/}"
            shot 1280,900 light "http://localhost:4000/news/$path" profile-light.png
            shot 1280,900 dark  "http://localhost:4000/news/$path" profile-dark.png
          fi
      - name: Upload screenshots
        # 一部失敗でも撮れた分は残す（レビューの材料になる）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: screenshots
          path: screenshots/
      # スクリーンショットを撮り終えたあとに置く。ここが失敗しても撮れた分は
      # 上のステップで既にアップロード済みなので、レビュー材料が失われない
      - name: Check article quality
        run: |
          python3 .claude/scripts/check_article_anchors.py _site
          # 本文が変わった投稿だけを渡す。この2つの検査が見るのは本文の記事項目
          # だけなので、front matter を一括更新した PR に全件を渡すと、その投稿が
          # 書かれた当時のルールで書かれた既存の本文まで今の検査にかかり、PR が
          # 持ち込んでいない違反で red になる（#401 で実測: title 行だけを直した
          # 368件を渡すと 2,453 件の不一致。同じ数が main 側の同じファイルでも出る）
          changed=$(python3 .claude/scripts/changed_post_bodies.py \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          if [ -n "$changed" ]; then
            echo "$changed"
            python3 .claude/scripts/check_article_notes.py $changed
            python3 .claude/scripts/check_source_hints.py $changed
          else
            echo "この PR は _posts の本文を変更していないためスキップ"
          fi
