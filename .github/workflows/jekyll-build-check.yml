name: Jekyll Build Check

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # latest 追従で全 PR の check が突然 red になるのを防ぐ（CI green はループのマージ条件）。
      # 更新は Renovate の PR で行う（.github/renovate.json5）
      # renovate: datasource=npm depName=playwright
      PLAYWRIGHT_VERSION: 1.64.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 変更された _posts だけを検査するため base ブランチとの diff を取れるようにする
          fetch-depth: 0
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
      # baseurl (/news) 込みの URL を再現するため /news 配下に置いて配信する
      - name: Serve site
        run: |
          mkdir -p serve/news
          cp -r _site/. serve/news/
          python3 -m http.server 4000 --directory serve &
          sleep 1
      - name: Install Playwright
        run: npx --yes "playwright@$PLAYWRIGHT_VERSION" install --with-deps chromium
      - name: Screenshot pages
        # 撮るページと幅は ci_screenshots.sh が正（workflow は保護パスなので、変わりやすい中身は外に置く）
        run: bash .claude/scripts/ci_screenshots.sh http://localhost:4000/news
      - name: Upload screenshots
        # 一部失敗でも撮れた分は残す（レビューの材料になる）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshots
          path: screenshots/
      # `.claude/` 配下の Python ユニットテストは置き場がスキルごとに分かれており、
      # repo ルートからの `unittest discover` は 0 件になる。置き場を見つけて回すのは
      # run_unit_tests.py の仕事（#413）。`.claude/` を触らない PR（毎朝のキュレーション等）
      # では走らせない
      - name: Run Python unit tests
        run: |
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            -- '.claude/')
          if [ -z "$changed" ]; then
            echo "この PR は .claude/ を変更していないためスキップ"
            exit 0
          fi
          python3 .claude/scripts/run_unit_tests.py
      # スクリーンショットを撮り終えたあとに置く。ここが失敗しても撮れた分は
      # 上のステップで既にアップロード済みなので、レビュー材料が失われない
      - name: Check article quality
        # 回す検査は ci_article_checks.sh が正（足す・外すはそちらで行う。workflow は保護パス）
        run: |
          bash .claude/scripts/ci_article_checks.sh \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
