title: "ha1f News"
lang: ja
timezone: Asia/Tokyo

author: ha1f

description: "海外のテック・経済ニュースも日本語で読める毎日キュレーション"
og_image: assets/og-image.png
url: "https://ha1f.github.io"
theme: minima
baseurl: "/news"
plugins:
  - jekyll-sitemap
header_pages: [about.md, profiles/index.md, archive.md]
# archive.html に直接描く直近の月数。それより前は archive-older.html に分け、必要になった時点で取得する (#354)
archive_initial_months: 3
# プロファイルページ (profile.html) に直接描く直近の月数 (#508)。それより前は profiles/older/*.html
profile_initial_months: 1
exclude: [CLAUDE.md, README.md, DESIGN.md, VISION.md]
rss: "RSS"

minima:
  date_format: "%Y年%-m月%-d日"
